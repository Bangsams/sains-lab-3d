* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(7, 12, 24, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg-2); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.1rem/1 var(--font-display); color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.brand svg { flex: none; }
.site-head small { color: var(--muted); font-size: 0.85rem; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 28px 64px; }

h1, h2 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.015em; margin: 0; }
.eyebrow { font: 600 0.78rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 0 0 14px; }

.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; align-items: end; margin-bottom: 28px; }
.hero h1 { font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: 1.05; font-weight: 700; }
.lede { max-width: 62ch; color: var(--muted); font-size: 1.05rem; margin: 16px 0 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--surface-solid); padding: 14px 16px; display: flex; flex-direction: column-reverse; gap: 4px; }
.stats dt { font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.stats dd { margin: 0; font: 600 1.8rem/1 var(--font-data); font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 22px; }
.field { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); }
.field input, .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-solid); color: var(--ink); min-width: 13rem; max-width: 100%; }
.filter-actions { display: flex; gap: 8px; margin-left: auto; }
.filter-actions .ghost { padding: 7px 12px; font-size: 0.85rem; }
.group { margin-bottom: 22px; }
.group-title { font-size: 0.8rem; font-family: var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
details.subject { --c: var(--accent); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; background: var(--surface); margin-bottom: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
details.subject > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 16px; }
details.subject > summary::-webkit-details-marker { display: none; }
details.subject > summary::after { content: "▸"; grid-column: 2; grid-row: 1; color: var(--c); transition: transform .15s; }
details.subject[open] > summary::after { transform: rotate(90deg); }
details.subject > summary .progress { grid-column: 1 / -1; }
.subj-name { font: 700 1.15rem/1.2 var(--font-display); }
.subj-meta { grid-column: 1; font: 0.8rem var(--font-data); color: var(--muted); }
details.subject .grid { padding: 0 16px 16px; }
.lab-tag { color: var(--dev) !important; border-color: var(--dev) !important; }
.banner { margin: 0 0 18px; padding: 10px 14px; border: 1px solid var(--warm); border-radius: 8px; color: var(--warm); background: rgba(255, 163, 107, 0.08); font-size: 0.92rem; }

/* menu dropdown di kepala situs */
.site-nav { display: flex; align-items: center; gap: 8px; }
.menu { position: relative; }
.menu-btn { display: flex; align-items: center; gap: 8px; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
.menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--accent); }
.user-btn { padding: 3px 12px 3px 3px; }
.user-btn img, .avatar { width: 26px; height: 26px; border-radius: 50%; }
.avatar { display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.7); }
.learn-pop { width: min(360px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; }
.menu-group { border-bottom: 1px solid var(--line); }
.menu-group:last-child { border-bottom: 0; }
.menu-group summary { cursor: pointer; padding: 9px 8px; font-weight: 700; }
.menu-subj { --c: var(--accent); display: grid; gap: 2px; padding: 0 8px 10px 14px; }
.menu-subj .subj { margin: 4px 0 2px; }
.menu-pop a, .menu-pop button { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; background: none; border: 0; cursor: pointer; font-size: 0.92rem; }
.menu-pop a:hover, .menu-pop button:hover { background: rgba(95, 214, 196, 0.12); }
.user-pop { width: 240px; }
.user-mail { margin: 4px 8px 8px; font-weight: 700; overflow-wrap: anywhere; }
.user-mail small { font-weight: 400; color: var(--muted); }
.guest-tag { font: 0.75rem var(--font-data); color: var(--warm); border: 1px solid var(--warm); border-radius: 999px; padding: 4px 10px; }

/* gerbang login */
.login { max-width: 640px; margin: 6vh auto 0; display: grid; gap: 18px; text-align: center; justify-items: center; }
.login h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); }
.login .lede { margin: 0; }
.login .stats { width: 100%; }
.login-btn { min-height: 44px; }
.login-err { color: var(--bad); margin: 0; }

/* label STEM dan riwayat */
.stem-badge { --s: var(--accent); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font: 700 0.78rem/1 var(--font-data); color: #061018; background: var(--s); }
[data-stem="S"] { --s: #9ade8b; } [data-stem="T"] { --s: #93b6ff; } [data-stem="E"] { --s: #ffa36b; } [data-stem="M"] { --s: #ef9fdc; }
.stem-filter select { min-width: 0; }
.q[hidden] { display: none; }
.stem-stats { grid-template-columns: repeat(4, 1fr); margin-bottom: 20px; }
.stem-stats dt { color: var(--s); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.hist { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.hist th, .hist td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.hist th { font: 600 0.75rem var(--font-data); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.hist td:first-child { white-space: nowrap; font-family: var(--font-data); font-size: 0.8rem; }
.hist .ans { font-family: var(--font-data); max-width: 14rem; overflow-wrap: anywhere; }
.hist .ok { color: var(--good); font-weight: 700; } .hist .no { color: var(--bad); font-weight: 700; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.92rem; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { --c: var(--accent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--c); transform: translateY(-2px); box-shadow: 0 0 0 1px var(--c), 0 10px 30px -12px var(--c); }
[data-subject="fisika"] { --c: var(--fis); } [data-subject="kimia"] { --c: var(--kim); }
[data-subject="biologi"] { --c: var(--bio); } [data-subject="aerospace"] { --c: var(--aer); }
[data-subject="coding"] { --c: var(--dev); } [data-subject="industri"] { --c: var(--ind); }
[data-subject="semikonduktor"] { --c: var(--semi); } [data-subject="siber"] { --c: var(--sib); }
[data-subject="ekonomi"] { --c: var(--eko); } [data-subject="keuangan"] { --c: var(--fin); } [data-subject="listrik"] { --c: var(--lis); }
.subj { font: 600 0.75rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.07em; color: var(--c); }
.card h3 { font-family: var(--font-display); margin: 0; font-size: 1.2rem; line-height: 1.15; }
.card p { margin: 0; color: var(--muted); font-size: 0.95rem; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--c); }
.progress-text { font: 0.75rem/1 var(--font-data); color: var(--muted); }
.empty { color: var(--muted); }

.crumbs { display: flex; gap: 14px; align-items: center; font-size: 0.92rem; margin-bottom: 12px; }
.crumbs a { text-decoration: none; font-weight: 700; }
.crumbs span { color: var(--muted); }
.topic-head { margin-bottom: 18px; }
.topic-head h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); line-height: 1.08; border-left: 5px solid var(--c); padding-left: 14px; }
.topic-head p { margin: 10px 0 0; color: var(--muted); max-width: 70ch; }

.topic { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { box-shadow: 0 0 60px -20px rgba(95, 214, 196, 0.35);position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); height: min(72vh, 680px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 15%, var(--stage-a), var(--stage-b)); }
.stage-canvas, .stage-canvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; }
.stage-tools button { background: var(--surface-solid); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer; }
.stage-hint { position: absolute; left: 12px; bottom: 8px; margin: 0; font: 0.75rem var(--font-data); color: var(--muted); pointer-events: none; }

.panel { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; cursor: pointer; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
[role="tabpanel"] { padding: 18px; display: grid; gap: 16px; }
[role="tabpanel"][hidden] { display: none; }

.formula { font: 0.95rem/1.6 var(--font-data); background: rgba(5, 9, 18, 0.55); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.out { background: var(--surface-solid); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.out.main { grid-column: 1 / -1; background: rgba(95, 214, 196, 0.08); }
.out-label { font-size: 0.8rem; color: var(--muted); }
.out-value { font: 600 1.05rem/1.25 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.out.main .out-value { font-size: 1.8rem; color: var(--accent); }
.out-value small { font-size: 0.75em; font-weight: 400; color: var(--muted); }

.controls { display: grid; gap: 14px; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.ctl-label { font-weight: 700; font-size: 0.92rem; }
.ctl output { font: 600 0.92rem var(--font-data); font-variant-numeric: tabular-nums; color: var(--accent); }
.ctl input[type="range"], .ctl select { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ctl select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.range-ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 0.72rem var(--font-data); color: var(--muted); }

.primary, .ghost { border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 700; justify-self: start; }
.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
.ghost:hover { border-color: var(--accent); }

.story { min-width: 0; }
.story p { margin: 0 0 12px; max-width: 65ch; }
.story pre { margin: 0 0 12px; padding: 10px 12px; background: rgba(5, 9, 18, 0.7); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font: 0.8rem/1.5 var(--font-data); }
.story code { font: 0.86em var(--font-data); color: var(--accent); }
.story pre code { font-size: inherit; color: var(--ink); }
.eq-title { font-size: 1.15rem; }
.eq-list { display: grid; gap: 14px; }
.eq { display: grid; gap: 8px; }
.eq-meaning { margin: 0; }
.symbols { margin: 0; display: grid; gap: 4px; font-size: 0.92rem; }
.symbols div { display: grid; grid-template-columns: minmax(3.2rem, auto) minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
.symbols div:last-child { border-bottom: 0; }
.symbols dt { font: 600 0.92rem var(--font-data); color: var(--accent); }
.symbols dd { margin: 0; }
.sym-unit { display: inline-block; font: 0.75rem var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 2px; }
.eq-details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.eq-details summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.eq-details[open] summary { margin-bottom: 12px; }
.note { margin: 0; color: var(--muted); font-size: 0.92rem; }

.quiz { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: q; }
.q { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; counter-increment: q; }
.q-head { display: flex; gap: 8px; align-items: center; }
.q-head::before { content: "Soal " counter(q); font: 600 0.78rem var(--font-data); color: var(--muted); }
.kind { font: 600 0.72rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.ok-badge { margin-left: auto; font-size: 0.78rem; font-weight: 700; color: var(--good); }
.q-prompt { margin: 0; }
.answer { display: grid; gap: 10px; }
.answer fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--bg); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.num { display: flex; gap: 8px; align-items: center; }
.num input { width: 12rem; max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-family: var(--font-data); }
.unit { color: var(--muted); font-family: var(--font-data); font-size: 0.9rem; }
.feedback { padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 0.95rem; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.next { font-weight: 700; text-decoration: none; }
.site-foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
.site-foot .wrap { padding-block: 18px; }

/* ---------- Lab Kode (IDE mini) ---------- */
.ide { margin-top: 28px; display: grid; gap: 14px; scroll-margin-top: 80px; }
.ide-head h2 { font-size: clamp(1.3rem, 2.4vw, 1.7rem); }
.ide-head p { color: var(--muted); max-width: 80ch; margin: 8px 0 0; }
.ide-head .eyebrow { margin-bottom: 8px; }
.ide code, .ide-tasks code { font: 0.86em var(--font-data); color: var(--accent); }
.ide-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.ide-editor, .ide-console, .ide-tasks { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.ide-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ide-bar .ghost, .ide-bar .primary { padding: 6px 12px; font-size: 0.85rem; }
.ide-bar .primary:disabled { opacity: 0.5; cursor: not-allowed; }
.ide-file { font: 600 0.82rem var(--font-data); color: var(--ink); }
.ide-count { font: 0.78rem var(--font-data); color: var(--muted); }
.ide-count.over { color: var(--bad); font-weight: 700; }
.ide-actions { margin-left: auto; display: flex; gap: 8px; }
.ide-code { display: grid; grid-template-columns: auto minmax(0, 1fr); height: min(62vh, 560px); background: rgba(5, 9, 18, 0.72); font: 13px/20px var(--font-data); }
.ide-gutter { margin: 0; padding: 10px 8px 10px 12px; overflow: hidden; text-align: right; color: rgba(163, 178, 204, 0.5); user-select: none; border-right: 1px solid var(--line); font: inherit; }
.ide-area { position: relative; min-width: 0; }
.ide-hl, .ide-area textarea { position: absolute; inset: 0; margin: 0; padding: 10px 12px; font: inherit; white-space: pre; tab-size: 2; overflow: auto; border: 0; }
/* ruang ekstra seukuran scrollbar textarea agar lapisan warna tetap sejajar saat digulir sampai ujung */
.ide-hl { pointer-events: none; color: var(--ink); overflow: hidden; padding-bottom: 40px; padding-right: 40px; }
.ide-gutter { padding-bottom: 40px; }
.ide-area textarea { resize: none; background: transparent; color: transparent; caret-color: var(--accent); outline: none; }
.ide-area textarea::selection { background: rgba(95, 214, 196, 0.28); color: transparent; }
.ide-area textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.tk-c { color: #7d8aa6; font-style: italic; } .tk-s { color: var(--good); } .tk-r { color: var(--kim); }
.tk-k { color: var(--fis); } .tk-n { color: var(--warm); } .tk-p { color: var(--accent); }
.ide-hint { margin: 0; padding: 8px 12px; font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); }
.ide-side { display: grid; gap: 14px; min-width: 0; }
.ide-out { height: min(34vh, 300px); overflow: auto; padding: 8px 10px; font: 12.5px/1.55 var(--font-data); background: rgba(5, 9, 18, 0.72); border-radius: 0 0 12px 12px; }
.ide-line { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.ide-line.muted { color: var(--muted); } .ide-line.warn { color: var(--warm); }
.ide-line.error { color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 2px 6px; }
.ide-goto { font: inherit; font-size: 0.72rem; margin-right: 8px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--bad); background: none; color: var(--bad); cursor: pointer; }
.ide-tasks { padding: 12px 14px; }
