/* Tata letak: rak instrumen — kanvas 3D besar di kiri, panel kontrol di kanan.
   Tema tunggal "Observatorium Malam": langit malam berbintang, panel kaca gelap. */
:root {
  --bg: #070c18; --bg-2: #0d1830; --surface: rgba(17, 27, 49, 0.78); --surface-solid: #111b31;
  --ink: #e8eef9; --muted: #a3b2cc; --line: rgba(140, 170, 220, 0.18);
  --accent: #5fd6c4; --accent-ink: #04241f; --warm: #ffa36b;
  --good: #86e0a8; --good-bg: rgba(52, 160, 100, 0.16); --bad: #ffab96; --bad-bg: rgba(220, 90, 60, 0.16);
  --fis: #93b6ff; --kim: #ef9fdc; --bio: #9ade8b; --aer: #ffa36b;
  --stage-a: #18284a; --stage-b: #050912;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
